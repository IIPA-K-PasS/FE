name: Deploy Flutter Web to GitHub Pages
on:
  push:
    branches: [ "kpaasTest" ]
    
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # ⭐ web 폴더가 없으면 생성
      - name: 🌐 Create Web Platform
        run: |
          if [ ! -d "web" ]; then
            flutter create . --platforms web
          fi
      
      - name: 🧩 Get Dependencies
        run: flutter pub get
      
      # ⭐ web/index.html에 base href placeholder 추가
      - name: 📝 Add Base Href Placeholder
        run: |
          if ! grep -q 'FLUTTER_BASE_HREF' web/index.html; then
            sed -i 's|<head>|<head>\n  <base href="$FLUTTER_BASE_HREF">|' web/index.html
          fi
      
      - name: 🏗️ Build Web App
        run: |
          flutter build web --release \
            --base-href "/FE/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=KAKAO_NATIVE_APP_KEY="${{ secrets.KAKAO_NATIVE_APP_KEY }}" \
            --dart-define=KAKAO_JAVASCRIPT_APP_KEY="${{ secrets.KAKAO_JAVASCRIPT_APP_KEY }}" \
            --dart-define=NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --dart-define=NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --dart-define=OPENWEATHERMAP_API_KEY="${{ secrets.OPENWEATHERMAP_API_KEY }}"
      
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
