name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "develop" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'  # ⭐ 핵심 수정

      - name: 🧩 Get Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web App
        run: |
          flutter build web \
            --release \
            --web-renderer html \
            --base-href "/FE/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=KAKAO_NATIVE_APP_KEY="${{ secrets.KAKAO_NATIVE_APP_KEY }}" \
            --dart-define=NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --dart-define=NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --dart-define=OPENWEATHERMAP_API_KEY="${{ secrets.OPENWEATHERMAP_API_KEY }}"

      - name: 🔐 Inject Kakao JS Key into index.html
        run: |
          JS_KEY="${{ secrets.KAKAO_JAVASCRIPT_KEY }}"
          ESCAPED_KEY=$(echo "$JS_KEY" | sed 's/[\/&]/\\&/g')
          sed -i "s|__KAKAO_JS_KEY__|$ESCAPED_KEY|g" ./build/web/index.html
          echo "✅ Kakao JS key injected"

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web