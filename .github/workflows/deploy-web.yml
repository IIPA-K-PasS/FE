name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "develop" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1' # 사용하시던 버전 유지

      - name: 🧩 Get Dependencies
        run: flutter pub get

      # 로컬 개발을 단순화하기 위해 .env를 자산으로 포함시킴.
      # CI에서는 시크릿으로 .env 파일을 생성해 빌드 시 파일 누락을 방지한다.
      - name: ✍️ Create .env for build
        run: |
          cat > .env << 'EOF'
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          EOF

      - name: 🏗️ Build Web App
        run: |
          flutter clean
          flutter build web \
            --release \
            --base-href "/FE/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=KAKAO_NATIVE_APP_KEY="${{ secrets.KAKAO_NATIVE_APP_KEY }}" \
            --dart-define=NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --dart-define=NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --dart-define=OPENWEATHERMAP_API_KEY="${{ secrets.OPENWEATHERMAP_API_KEY }}"

      # ⭐ 핵심 수정: Python 스크립트가 frame-src, child-src 도 '분석'하고 '재조합'하도록 변경
      - name: 🔐 Modify CSP and Inject Kakao SDK
        run: |
          python3 << 'EOF'
          import os
          import re
          
          JS_KEY = os.environ.get('JS_KEY', '')
          if not JS_KEY:
              print('❌ KAKAO_JAVASCRIPT_KEY secret이 설정되지 않았습니다.')
              exit(1)
          
          print(f'✅ JS_KEY 수신됨: {JS_KEY[:10]}...')
          
          index_path = './build/web/index.html'
          try:
              with open(index_path, 'r', encoding='utf-8') as f:
                  content = f.read()
          except FileNotFoundError:
              print(f'❌ {index_path} 파일을 찾을 수 없습니다. 빌드 단계가 실패했는지 확인하세요.')
              exit(1)

          print(f'📄 index.html 원본 크기: {len(content)} bytes')

          # --- 1. CSP 태그 수정 (더욱 강력한 방식으로 변경) ---
          csp_pattern = re.compile(r'(<meta http-equiv="Content-Security-Policy" content=")(.*?)(">)')
          match = csp_pattern.search(content)
          
          if match:
              print("✅ Flutter가 생성한 기존 CSP 태그를 찾았습니다.")
              original_csp_content = match.group(2)
              print(f"ℹ️ 발견된 원본 CSP: {original_csp_content}")
              
              # 1. 기존 지시문 파싱
              directives = {}
              if original_csp_content:
                  parts = original_csp_content.split(';')
                  for part in parts:
                      part = part.strip()
                      if part:
                          space_index = part.find(' ')
                          if space_index != -1:
                              name = part[:space_index]
                              values = part[space_index+1:].split()
                              directives[name] = set(values) # set을 사용해 중복 방지
                          else:
                              directives[part] = set()

              # 2. script-src 수정/추가
              script_sources = directives.get('script-src', {"'self'"}) # 없으면 'self' 기본값
              script_sources.add("'unsafe-eval'")
              script_sources.add("https://developers.kakao.com")
              script_sources.add("https://*.kakao.com")
              directives['script-src'] = script_sources
              print(f"✅ 'script-src' 수정됨: {' '.join(sorted(list(script_sources)))}")

              # 3. connect-src 수정/추가
              connect_sources = directives.get('connect-src', {"'self'"}) # 없으면 'self' 기본값
              connect_sources.add("https://kauth.kakao.com")
              connect_sources.add("https://*.kakao.com")
              directives['connect-src'] = connect_sources
              print(f"✅ 'connect-src' 수정됨: {' '.join(sorted(list(connect_sources)))}")

              # 4. frame-src 수정/추가 (⭐ 요청 사항 반영)
              frame_sources = directives.get('frame-src', {"'self'"})
              frame_sources.add("https://kauth.kakao.com")
              frame_sources.add("https://*.kakao.com")
              directives['frame-src'] = frame_sources
              print(f"✅ 'frame-src' 수정됨: {' '.join(sorted(list(frame_sources)))}")
              
              # 5. child-src 수정/추가 (⭐ 요청 사항 반영)
              child_sources = directives.get('child-src', {"'self'"})
              child_sources.add("https://*.kakao.com")
              directives['child-src'] = child_sources
              print(f"✅ 'child-src' 수정됨: {' '.join(sorted(list(child_sources)))}")

              # 6. CSP content 문자열 재조합
              new_csp_parts = []
              for name, values in directives.items():
                  if values:
                      new_csp_parts.append(f"{name} {' '.join(sorted(list(values)))}")
                  else:
                      new_csp_parts.append(name) # 값이 없는 지시문
              
              new_csp_content = '; '.join(new_csp_parts)
              
              # 7. 원본 HTML의 CSP content 교체
              content = csp_pattern.sub(f'\\1{new_csp_content}\\3', content)
              print(f"✅ CSP 메타 태그를 새 내용으로 교체했습니다: {new_csp_content}")
          
          else:
              print("⚠️ Flutter가 생성한 CSP 태그를 찾지 못했습니다. 새 태그를 주입합니다. (비권장)")
              # Fallback 로직에도 frame-src, child-src 추가
              csp_meta = '<meta http-equiv="Content-Security-Policy" content="script-src \'self\' \'unsafe-eval\' https://developers.kakao.com https://*.kakao.com; connect-src \'self\' https://kauth.kakao.com https://*.kakao.com; frame-src \'self\' https://kauth.kakao.com https://*.kakao.com; child-src \'self\' https://*.kakao.com">'
              content = content.replace('</head>', f'  {csp_meta}\n</head>', 1)

          # --- 2. Kakao SDK 스크립트 주입 (기존 로직 유지) ---
          
          pattern = r'<script src="https://developers\.kakao\.com/sdk/js/kakao\.js"></script>.*?window\.kakaoLogin = kakaoLogin;[\s\S]*?</script>'
          content = re.sub(pattern, '', content, flags=re.DOTALL)
          print("ℹ️ 기존 카카오 스크립트(플레이스홀더) 제거 시도")
          
          kakao_script = f'''<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
          <script>
            (function initKakao() {{
              try {{
                Kakao.init('{JS_KEY}');
                console.log('Kakao SDK init:', Kakao.isInitialized());
              }} catch (e) {{ console.error('Kakao SDK init failed:', e); }}
            }})();
            
            function kakaoLogin() {{
              try {{
                console.log('kakaoLogin() 호출됨. 리디렉션 시도...');
                Kakao.Auth.authorize({{
                  redirectUri: 'https://iipa-k-pass.github.io/FE/auth/callback'
                }});
              }} catch (e) {{ console.error('Kakao.Auth.authorize failed:', e); }}
            }}
            window.kakaoLogin = kakaoLogin;
            console.log('window.kakaoLogin이 전역에 설정되었습니다.');
          </script>'''
          
          if '</head>' in content:
              content = content.replace('</head>', f'{kakao_script}\n  </head>', 1)
              print('✅ Kakao SDK 스크립트를 </head> 직전에 주입했습니다.')
          else:
              print('❌ </head> 태그를 찾지 못해 스크립트 주입에 실패했습니다.')
              exit(1)
          
          with open(index_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print(f'📄 index.html 수정 완료. 최종 크기: {len(content)} bytes')
          EOF
        env:
          JS_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }} # GitHub Secret 이름 확인

      # --- 3. 캐시 무효화 및 SW 비활성화 ---
      - name: ♻️ Bust cache and disable Service Worker
        run: |
          # flutter_bootstrap.js 캐시 무효화 쿼리 추가
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${GITHUB_RUN_NUMBER}|" ./build/web/index.html || true
          # main.dart.js 캐시 무효화 (새 템플릿에선 bootstrap에서 로드하지만 방어적으로 처리)
          sed -i "s|main.dart.js|main.dart.js?v=${GITHUB_RUN_NUMBER}|" ./build/web/index.html || true
          # SW 파일 제거로 등록 방지 (Flutter는 파일 존재시 등록)
          rm -f ./build/web/flutter_service_worker.js || true
          # 버전 파일 제거 (강제 재로드 유도)
          rm -f ./build/web/version.json || true

      # --- 3. 배포 (기존과 동일) ---
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

