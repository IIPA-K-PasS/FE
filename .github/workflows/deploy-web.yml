name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "develop" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'  # ⭐ 핵심 수정

      - name: 🧩 Get Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web App
        run: |
          flutter clean
          flutter build web \
            --release \
            --base-href "/FE/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=KAKAO_NATIVE_APP_KEY="${{ secrets.KAKAO_NATIVE_APP_KEY }}" \
            --dart-define=NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --dart-define=NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --dart-define=OPENWEATHERMAP_API_KEY="${{ secrets.OPENWEATHERMAP_API_KEY }}"

      - name: 🔐 Inject Kakao SDK and JS Key
        run: |
          python3 << 'EOF'
          import os
          import re
          
          JS_KEY = os.environ.get('JS_KEY', '')
          if not JS_KEY:
              print('❌ KAKAO_JAVASCRIPT_KEY is not set')
              exit(1)
          
          print(f'✅ JS_KEY received: {JS_KEY[:10]}...')
          
          index_path = './build/web/index.html'
          with open(index_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          print(f'📄 index.html size before: {len(content)} bytes')
          
          # CSP 메타 태그 추가 (Kakao SDK의 eval 허용)
          csp_meta = '<meta http-equiv="Content-Security-Policy" content="script-src \'self\' \'unsafe-eval\' \'unsafe-inline\' https://developers.kakao.com https://*.kakao.com; connect-src \'self\' https://developers.kakao.com https://*.kakao.com https://kauth.kakao.com">'
          
          # </head> 앞에 CSP 추가 (이미 있으면 추가 안 함)
          if 'Content-Security-Policy' not in content:
              content = content.replace('</head>', f'  {csp_meta}\n</head>', 1)
              print('✅ CSP meta tag added')
          
          # 기존 Kakao 스크립트 제거 (플레이스홀더 포함)
          pattern = r'<script src="https://developers\.kakao\.com/sdk/js/kakao\.js"></script>.*?window\.kakaoLogin = kakaoLogin;[\s\S]*?</script>'
          content = re.sub(pattern, '', content, flags=re.DOTALL)
          
          print(f'📄 index.html size after removal: {len(content)} bytes')
          
          # 새 Kakao SDK 및 초기화 스크립트 추가
          kakao_script = f'''<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
          <script>
            (function initKakao() {{
              try {{
                Kakao.init('{JS_KEY}');
                console.log('Kakao init:', Kakao.isInitialized());
              }} catch (e) {{ console.error('Kakao init failed:', e); }}
            }})();
            
            function kakaoLogin() {{
              try {{
                Kakao.Auth.authorize({{
                  redirectUri: 'https://iipa-k-pass.github.io/FE/auth/callback'
                }});
              }} catch (e) {{ console.error('Kakao authorize failed:', e); }}
            }}
            window.kakaoLogin = kakaoLogin;
          </script>'''
          
          # </head> 앞에 주입
          if '</head>' in content:
              content = content.replace('</head>', f'{kakao_script}\n  </head>', 1)
              print('✅ Kakao script injected successfully')
          else:
              print('❌ </head> tag not found in index.html')
              exit(1)
          
          with open(index_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print('✅ Kakao SDK and JS key injected')
          EOF
        env:
          JS_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web