name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "kpaasTest2" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.1'

      - name: 🧩 Get Dependencies
        run: flutter pub get

      - name: ✍️ Create .env for build
        run: |
          cat > .env << 'EOF'
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          EOF

      - name: 🏗️ Build Web App
        run: |
          flutter clean
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href "/FE/" \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=KAKAO_NATIVE_APP_KEY="${{ secrets.KAKAO_NATIVE_APP_KEY }}" \
            --dart-define=NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --dart-define=NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --dart-define=OPENWEATHERMAP_API_KEY="${{ secrets.OPENWEATHERMAP_API_KEY }}"

      - name: 🔐 Modify CSP and Inject Kakao SDK
        run: |
          python3 << 'EOF'
          import os
          import re
          
          JS_KEY = os.environ.get('JS_KEY', '')
          if not JS_KEY:
              print('❌ KAKAO_JAVASCRIPT_KEY secret이 설정되지 않았습니다.')
              exit(1)
          
          print(f'✅ JS_KEY 수신됨: {JS_KEY[:10]}...')
          
          index_path = './build/web/index.html'
          try:
              with open(index_path, 'r', encoding='utf-8') as f:
                  content = f.read()
          except FileNotFoundError:
              print(f'❌ {index_path} 파일을 찾을 수 없습니다.')
              exit(1)

          print(f'📄 index.html 원본 크기: {len(content)} bytes')

          # --- 1. CSP 태그 수정 ---
          csp_pattern = re.compile(r'(<meta http-equiv="Content-Security-Policy" content=")(.*?)(">)')
          match = csp_pattern.search(content)
          
          if match:
              print("✅ 기존 CSP 태그 발견")
              original_csp_content = match.group(2)
              
              directives = {}
              if original_csp_content:
                  parts = original_csp_content.split(';')
                  for part in parts:
                      part = part.strip()
                      if part:
                          space_index = part.find(' ')
                          if space_index != -1:
                              name = part[:space_index]
                              values = part[space_index+1:].split()
                              directives[name] = set(values)
                          else:
                              directives[part] = set()

              # script-src 및 script-src-elem 수정
              script_sources = directives.get('script-src', {"'self'"})
              script_sources.add("'unsafe-eval'")
              script_sources.add("'unsafe-inline'")
              script_sources.add("https://developers.kakao.com")
              script_sources.add("https://*.kakao.com")
              script_sources.add("https://t1.kakaocdn.net")
              script_sources.add("https://*.kakaocdn.net")
              script_sources.add("https://www.gstatic.com")
              script_sources.add("https://*.gstatic.com")
              directives['script-src'] = script_sources
              directives['script-src-elem'] = script_sources
              print(f"✅ 'script-src' 및 'script-src-elem' 수정")

              # connect-src 수정
              connect_sources = directives.get('connect-src', {"'self'"})
              connect_sources.add("https://kauth.kakao.com")
              connect_sources.add("https://*.kakao.com")
              connect_sources.add("https://t1.kakaocdn.net")
              connect_sources.add("https://*.kakaocdn.net")
              connect_sources.add("https://www.gstatic.com")
              connect_sources.add("https://*.gstatic.com")
              connect_sources.add("https://fonts.gstatic.com")
              directives['connect-src'] = connect_sources

              # frame-src 수정
              frame_sources = directives.get('frame-src', {"'self'"})
              frame_sources.add("https://kauth.kakao.com")
              frame_sources.add("https://*.kakao.com")
              directives['frame-src'] = frame_sources
              
              # child-src 수정
              child_sources = directives.get('child-src', {"'self'"})
              child_sources.add("https://*.kakao.com")
              directives['child-src'] = child_sources

              # font-src 추가
              font_sources = directives.get('font-src', {"'self'"})
              font_sources.add("https://fonts.gstatic.com")
              font_sources.add("data:")
              directives['font-src'] = font_sources

              # style-src 추가
              style_sources = directives.get('style-src', {"'self'"})
              style_sources.add("'unsafe-inline'")
              directives['style-src'] = style_sources

              # img-src 추가
              img_sources = directives.get('img-src', {"'self'"})
              img_sources.add("data:")
              img_sources.add("https:")
              directives['img-src'] = img_sources

              # CSP 재조합
              new_csp_parts = []
              for name, values in directives.items():
                  if values:
                      new_csp_parts.append(f"{name} {' '.join(sorted(list(values)))}")
                  else:
                      new_csp_parts.append(name)
              
              new_csp_content = '; '.join(new_csp_parts)
              content = csp_pattern.sub(f'\\1{new_csp_content}\\3', content)
              print(f"✅ CSP 교체 완료")
          
          else:
              print("⚠️ CSP 태그 없음. 새로 생성")
              csp_meta = '<meta http-equiv="Content-Security-Policy" content="script-src \'self\' \'unsafe-eval\' \'unsafe-inline\' https://developers.kakao.com https://*.kakao.com https://t1.kakaocdn.net https://*.kakaocdn.net https://www.gstatic.com https://*.gstatic.com; script-src-elem \'self\' \'unsafe-eval\' \'unsafe-inline\' https://developers.kakao.com https://*.kakao.com https://t1.kakaocdn.net https://*.kakaocdn.net https://www.gstatic.com https://*.gstatic.com; connect-src \'self\' https://kauth.kakao.com https://*.kakao.com https://t1.kakaocdn.net https://*.kakaocdn.net https://www.gstatic.com https://*.gstatic.com https://fonts.gstatic.com; frame-src \'self\' https://kauth.kakao.com https://*.kakao.com; child-src \'self\' https://*.kakao.com; font-src \'self\' https://fonts.gstatic.com data:; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: https:">'
              content = content.replace('</head>', f'  {csp_meta}\n</head>', 1)

          # --- 2. Kakao SDK 스크립트 주입 ---
          # 기존 플레이스홀더 제거
          pattern = r'<script[^>]*src="https://developers\.kakao\.com/sdk/js/kakao\.js"[^>]*></script>.*?window\.kakaoLogin = kakaoLogin;[\s\S]*?</script>'
          content = re.sub(pattern, '', content, flags=re.DOTALL)
          
          # 새 Kakao SDK 스크립트 주입
          kakao_script = f'''<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" 
            integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka" 
            crossorigin="anonymous"></script>
          <script>
            (function initKakao() {{
              if (typeof Kakao === 'undefined') {{
                console.error('❌ Kakao SDK 로드 실패');
                return;
              }}
              try {{
                if (!Kakao.isInitialized()) {{
                  Kakao.init('{JS_KEY}');
                  console.log('✅ Kakao SDK 초기화 완료:', Kakao.isInitialized());
                }}
              }} catch (e) {{ 
                console.error('❌ Kakao SDK 초기화 실패:', e); 
              }}
            }})();
            
            function kakaoLogin() {{
              if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {{
                console.error('❌ Kakao SDK가 초기화되지 않았습니다');
                return;
              }}
              try {{
                console.log('🔐 카카오 로그인 시작...');
                Kakao.Auth.authorize({{
                  redirectUri: 'https://iipa-k-pass.github.io/FE/auth/callback'
                }});
              }} catch (e) {{ 
                console.error('❌ 카카오 로그인 실패:', e); 
              }}
            }}
            window.kakaoLogin = kakaoLogin;
            console.log('✅ window.kakaoLogin 설정 완료');
          </script>'''
          
          if '</head>' in content:
              content = content.replace('</head>', f'{kakao_script}\n  </head>', 1)
              print('✅ Kakao SDK 스크립트 주입 완료')
          else:
              print('❌ </head> 태그 없음')
              exit(1)
          
          with open(index_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print(f'✅ index.html 수정 완료: {len(content)} bytes')
          EOF
        env:
          JS_KEY: ${{ secrets.KAKAO_JAVASCRIPT_APP_KEY }}

      - name: ♻️ Service Worker 완전 제거 및 Cache Bust
        run: |
          CACHE_BUST="${GITHUB_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          echo "🔄 Cache bust: $CACHE_BUST"
          
          # Service Worker 파일 삭제
          rm -f ./build/web/flutter_service_worker.js
          rm -f ./build/web/version.json
          echo "✅ Service Worker 파일 삭제 완료"
          
          # flutter_bootstrap.js 수정 (Service Worker 등록 코드 제거)
          if [ -f "./build/web/flutter_bootstrap.js" ]; then
            python3 << 'PYTHON_EOF'
          import re
          
          bootstrap_path = './build/web/flutter_bootstrap.js'
          try:
              with open(bootstrap_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Service Worker 등록 관련 코드 패턴 제거
              patterns = [
                  # navigator.serviceWorker.register 전체 블록
                  r"navigator\.serviceWorker\.register\([^)]*\)\.then[^}]*\}[^}]*\}[^}]*\}",
                  r"navigator\.serviceWorker\.register\([^)]*\)[^;]*;?",
                  # if ('serviceWorker' in navigator) 블록
                  r"if\s*\(\s*['\"]serviceWorker['\"]\s+in\s+navigator\s*\)\s*\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}",
                  # window.addEventListener('load') 내부 serviceWorker 관련
                  r"window\.addEventListener\(['\"]load['\"],\s*(?:function\(\)\s*\{|\(\)\s*=>\s*\{)[^{}]*serviceWorker[^{}]*(?:\{[^{}]*\}[^{}]*)*\}\s*\);?",
              ]
              
              original_length = len(content)
              for pattern in patterns:
                  content = re.sub(pattern, '// Service Worker disabled', content, flags=re.DOTALL)
              
              if len(content) != original_length:
                  print(f'✅ flutter_bootstrap.js에서 Service Worker 코드 제거 ({original_length} -> {len(content)} bytes)')
              else:
                  print('ℹ️ flutter_bootstrap.js에 Service Worker 코드 없음')
              
              with open(bootstrap_path, 'w', encoding='utf-8') as f:
                  f.write(content)
                  
          except FileNotFoundError:
              print('⚠️ flutter_bootstrap.js 파일 없음')
          except Exception as e:
              print(f'⚠️ flutter_bootstrap.js 처리 중 오류: {e}')
          PYTHON_EOF
          else
            echo "⚠️ flutter_bootstrap.js 파일이 없습니다"
          fi
          
          # index.html에서 Service Worker 관련 코드 제거
          python3 << 'PYTHON_EOF'
          import re
          
          with open('./build/web/index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Service Worker 등록 코드 제거
          patterns = [
              r"navigator\.serviceWorker\.register\([^)]+\)[^;]*;?",
              r"if\s*\(\s*['\"]serviceWorker['\"]\s+in\s+navigator\s*\)\s*\{[^}]*(?:\{[^}]*\}[^}]*)*\}",
              r"window\.addEventListener\(['\"]load['\"],\s*(?:function\(\)|(?:\(\)\s*=>))\s*\{[^}]*serviceWorker[^}]*(?:\{[^}]*\}[^}]*)*\}\s*\);?",
          ]
          
          for pattern in patterns:
              content = re.sub(pattern, '', content, flags=re.DOTALL)
          
          with open('./build/web/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print('✅ index.html Service Worker 코드 제거 완료')
          PYTHON_EOF
          
          # Cache busting
          sed -i "s|scriptTag.src = 'flutter.js';|scriptTag.src = 'flutter.js?v=$CACHE_BUST';|g" ./build/web/index.html
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=$CACHE_BUST|g" ./build/web/index.html || true
          sed -i "s|main.dart.js|main.dart.js?v=$CACHE_BUST|g" ./build/web/index.html || true
          
          # 버전 메타 태그 추가
          if ! grep -q 'meta name="version"' ./build/web/index.html; then
            sed -i "s|</head>|  <meta name=\"version\" content=\"$CACHE_BUST\">\n</head>|" ./build/web/index.html
          fi
          
          echo "✅ Cache busting 완료: $CACHE_BUST"

      - name: 🎨 Add Favicon
        run: |
          # 간단한 SVG favicon 생성 (404 방지)
          cat > ./build/web/favicon.ico << 'FAVICON_EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#4285f4"/>
            <text x="50" y="65" font-size="60" text-anchor="middle" fill="white" font-family="Arial">B</text>
          </svg>
          FAVICON_EOF
          echo "✅ favicon.ico 생성 완료"

      - name: 📝 Ensure manifest.json
        run: |
          if [ ! -f "./build/web/manifest.json" ]; then
            cat > ./build/web/manifest.json << 'MANIFEST_EOF'
          {
            "name": "Billow",
            "short_name": "Billow",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4285f4",
            "description": "Billow Web App",
            "orientation": "portrait-primary",
            "prefer_related_applications": false,
            "icons": []
          }
          MANIFEST_EOF
            echo "✅ manifest.json 생성 완료"
          else
            echo "✅ manifest.json 이미 존재"
          fi

      - name: 🔍 Verify Configuration
        run: |
          echo "=== 📋 CSP 확인 ==="
          grep -o 'Content-Security-Policy" content="[^"]*"' ./build/web/index.html | head -c 200 || true
          echo "..."
          echo ""
          echo "=== 🔐 Kakao SDK 확인 ==="
          grep -o 'kakao.*\.js' ./build/web/index.html || true
          echo ""
          echo "=== 🚫 Service Worker 확인 ==="
          if grep -q "serviceWorker" ./build/web/index.html; then
            echo "⚠️ index.html에 Service Worker 코드 존재"
            grep -n "serviceWorker" ./build/web/index.html || true
          else
            echo "✅ index.html에 Service Worker 코드 없음"
          fi
          
          if [ -f "./build/web/flutter_bootstrap.js" ]; then
            if grep -q "serviceWorker" ./build/web/flutter_bootstrap.js; then
              echo "⚠️ flutter_bootstrap.js에 Service Worker 코드 존재"
            else
              echo "✅ flutter_bootstrap.js에 Service Worker 코드 없음"
            fi
          fi
          
          echo ""
          echo "=== 📦 파일 목록 ==="
          ls -lh ./build/web/*.{html,js,json,ico} 2>/dev/null || true

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false