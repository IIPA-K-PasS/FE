name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # gh-pages 브랜치에 쓰기 권한 부여
    permissions:
      contents: write 
    
    steps:
      # 1. 레포지토리 코드 가져오기
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
      
      # 2. Flutter 환경 설정
      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. 프로젝트 의존성 설치
      # 🚨 수정: 'working-directory' 제거
      # pubspec.yaml이 있는 저장소 루트에서 바로 실행합니다.
      - name: 🧩 Get Dependencies
        run: flutter pub get

      # 4. Flutter 웹 앱 빌드
      # 🚨 수정: 'working-directory' 제거
      # --base-href "/FE/"는 저장소 이름이 FE이므로 올바르게 설정하셨습니다.
      - name: 🏗️ Build Web App
        run: flutter build web --release --base-href "/FE/"

      # 5. 빌드 결과물을 GitHub Pages에 배포
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 🚨 수정: 'billow' 경로 제거
          # 빌드 결과물은 저장소 루트의 build/web 폴더에 생성됩니다.
          publish_dir: ./build/web
