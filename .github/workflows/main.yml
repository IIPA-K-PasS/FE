name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시될 때 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # gh-pages 브랜치에 쓰기 권한 부여
    permissions:
      contents: write 
    
    steps:
      # 1. 레포지토리 코드 가져오기
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
      
      # 2. Flutter 환경 설정
      - name: ☕ Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ⭐ 3. (수정됨) Flutter 웹 설정 및 파일 생성
      # 이 명령어가 'web' 폴더와 관련 설정 파일을 생성합니다.
      - name: 🌐 Configure Flutter for Web
        run: flutter create . --platforms web

      # 4. 프로젝트 의존성 설치
      - name: 🧩 Get Dependencies
        run: flutter pub get

      # 5. Flutter 웹 앱 빌드
      - name: 🏗️ Build Web App
        run: flutter build web --release --base-href "/FE/"

      # 6. 빌드 결과물을 GitHub Pages에 배포
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

