  <script>
  // Service Worker 무력화
  if ('serviceWorker' in navigator) {
    Object.defineProperty(navigator, 'serviceWorker', {
      get: function() { 
        console.log('⚠️ Service Worker 접근 차단됨');
        return {
          register: function() { 
            console.log('⚠️ Service Worker 등록 시도 차단됨');
            return Promise.resolve(); 
          },
          ready: Promise.resolve(),
          controller: null
        };
      }
    });
  }
  console.log('✅ Service Worker 무력화 완료');
</script>

    } catch (e) { 
      console.error('❌ Kakao SDK 초기화 실패:', e); 
    }
  })();
  
  function kakaoLogin() {
    if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {

    }
  }
  window.kakaoLogin = kakaoLogin;
  console.log('✅ window.kakaoLogin 설정 완료');
