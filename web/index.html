<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Billow Web" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Billow</title>
  <base href="/FE/" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" />
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <script>
    // CI에서 주입될 키(플레이스홀더)
    const __KAKAO_JS_KEY__ = '__KAKAO_JS_KEY__';
    (function initKakao() {
      try {
        if (!__KAKAO_JS_KEY__ || __KAKAO_JS_KEY__ === '__KAKAO_JS_KEY__') {
          console.warn('Kakao JS key is not injected. Check CI secrets.');
        } else {
          Kakao.init(__KAKAO_JS_KEY__);
          console.log('Kakao init:', Kakao.isInitialized());
        }
      } catch (e) { console.error('Kakao init failed:', e); }
    })();

    function kakaoLogin() {
      try {
        Kakao.Auth.authorize({
          redirectUri: 'https://iipa-k-pass.github.io/FE/auth/callback'
        });
      } catch (e) { console.error('Kakao authorize failed:', e); }
    }
    window.kakaoLogin = kakaoLogin;
  </script>
</head>
<body>
  <script>
    // Flutter loader
    window.addEventListener('load', function() {
      var scriptTag = document.createElement('script');
      scriptTag.src = 'flutter.js';
      scriptTag.defer = true;
      scriptTag.onload = function() { _flutter.loader.loadEntrypoint({}).then(function(engineInitializer) { return engineInitializer.initializeEngine(); }).then(function(appRunner) { return appRunner.runApp(); }); };
      document.body.append(scriptTag);
    });
  </script>
  <noscript>JavaScript is required to run this app.</noscript>
</body>
</html>
